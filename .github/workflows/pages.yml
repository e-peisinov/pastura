# Publicaba la app de campo (poc/) en GitHub Pages. La app pasó a public/app/
# y se sirve desde el servidor del panel (P9): este workflow ya no corre y se
# borra cuando el servidor esté andando.
name: Publicar app de campo

on:
  push:
    branches: [main]
    paths: ['poc/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: poc
      - id: deploy
        uses: actions/deploy-pages@v4
